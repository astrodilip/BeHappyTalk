name: Deploy to VPS

on:
  push:
    branches:
      - main
    # Only the Express server runs on the VPS, so app-only commits skip the deploy.
    paths:
      - 'server/**'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Never let two deploys race each other onto the same box.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  # One short command: reset to the revision being deployed, then hand off to the
  # script in the repo. SSH from GitHub runners to this box drops connections
  # intermittently, and a short-lived session is far less likely to be cut off
  # mid-deploy than one streaming a long inline script.
  DEPLOY_CMD: |
    cd /var/www/behappytalk
    git fetch origin main
    git reset --hard origin/main
    sh scripts/deploy.sh

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy over SSH (attempt 1)
        id: attempt1
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script_stop: true
          script: ${{ env.DEPLOY_CMD }}

      - name: Deploy over SSH (attempt 2)
        id: attempt2
        if: steps.attempt1.outcome == 'failure'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script_stop: true
          script: ${{ env.DEPLOY_CMD }}

      - name: Report SSH outcome
        run: |
          echo "attempt 1: ${{ steps.attempt1.outcome }}"
          echo "attempt 2: ${{ steps.attempt2.outcome || 'skipped' }}"

      # The real gate: does the public API answer? This runs from the runner over
      # HTTPS, so it verifies the whole path through nginx and does not depend on
      # the SSH session surviving. A deploy whose SSH step died after reloading
      # still passes here, and a genuinely broken deploy still fails the job.
      - name: Verify the live API
        run: |
          set -eu
          URL=https://provider.behappytalk.com/api/providers
          for attempt in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$URL" || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "API healthy on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt: HTTP $CODE - retrying in 10s"
            sleep 10
          done
          echo "::error::The live API never returned 200 after the deploy"
          exit 1
